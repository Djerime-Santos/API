spring.application.name=ordermanager

# Configuração do Servidor
server.port=8080

# Configuração da Base de Dados PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/order_manager
spring.datasource.username=postgres
spring.datasource.password=123456789
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuração do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuração de Logs em Ficheiro
logging.file.name=logs/order-manager.log
logging.level.org.springframework=INFO
logging.level.com.example.ordermanager=DEBUG
